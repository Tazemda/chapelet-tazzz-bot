<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🧠 CHAPELET TAZZZ BOT – EXPERTISE 7 JOURS</title>
    <style>
        /* (tous les styles précédents, inchangés, sauf les ajouts ci-dessous) */
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a36 0%, #0f171f 100%);
            margin: 0;
            padding: 20px;
            color: #f0f0f0;
            min-height: 100vh;
        }
        /* ... tous les styles du chargement, container, etc. inchangés ... */
        /* On va juste ajouter/modifier les styles pour la barre de jour avec flèches */

        .jour-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            border-radius: 50px;
            padding: 5px 15px;
            margin: 10px 20px 0 20px;
            backdrop-filter: blur(4px);
        }
        .jour-nav-arrow {
            background: rgba(200,200,200,0.15);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
            opacity: 0.3;
            color: white;
        }
        .jour-nav-arrow:hover {
            opacity: 0.9;
            background: rgba(230,126,34,0.6);
            transform: scale(1.05);
        }
        .jour-title {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: #f1c40f;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            margin: 0;
        }
        @media (max-width: 600px) {
            .jour-nav-arrow { width: 32px; height: 32px; font-size: 20px; }
            .jour-title { font-size: 1.4rem; }
        }
        /* On supprime la classe .nav-buttons et on cache les anciens boutons */
        .nav-buttons {
            display: none;
        }
        /* On ajuste le conteneur pour ne pas avoir de margin inutile */
        .jour-title-container {
            text-align: center;
        }
        /* Le reste des styles (progress-segments, result, swipe-arrow etc.) est conservé */
    </style>
</head>
<body>
    <!-- ... loading screen ... -->
    <div id="mainContent" style="display: none;">
        <div class="container">
            <!-- ... haut de page (titre, historique, modes) inchangé ... -->
            <div id="expertisePanel" class="mode-panel active-panel">
                <p>🔬 Domaine à maîtriser :</p>
                <input type="text" id="domaine" placeholder="Ex: Recherche clinique, Python, Prise de parole...">
                <button id="startExpertise">✨ DÉMARRER L'EXPERTISE ✨</button>
                <div id="jourContainer" style="display:none;">
                    <div id="progressHeaderMsg" class="progress-header" style="display:none;">👉 cliquez ici pour valider cette journée !</div>
                    <div id="segmentsContainer" class="progress-segments"></div>
                    <!-- Nouvelle barre avec flèches pour naviguer entre les jours -->
                    <div id="jourHeader" class="jour-header" style="display: none;">
                        <div id="prevDayArrow" class="jour-nav-arrow">◀</div>
                        <div id="jourTitle" class="jour-title"></div>
                        <div id="nextDayArrow" class="jour-nav-arrow">▶</div>
                    </div>
                    <div id="jourContentContainer" style="position: relative;">
                        <div id="jourContent" class="result"></div>
                        <div id="swipeLeftArrow" class="swipe-arrow swipe-left" style="display: none;">◀</div>
                        <div id="swipeRightArrow" class="swipe-arrow swipe-right" style="display: none;">▶</div>
                        <button id="audioWelcomeBtn" class="audio-welcome" style="display:none;">🔊</button>
                        <button id="audioDayBtn" class="audio-day" style="display:none;">🔊</button>
                    </div>
                    <!-- Les anciens boutons de navigation sont supprimés : plus de div.nav-buttons -->
                    <div id="expertiseProgressArea" class="progress-container" style="display:none;">
                        <div class="progress-fill" id="expertiseProgressFill"></div>
                        <div class="progress-percent" id="expertiseProgressPercent"></div>
                    </div>
                    <div id="feedbackBox" class="feedback-box" style="display:none;">
                        <p>🌟 Ce chapelet vous a-t-il été utile ?</p>
                        <div class="stars" id="starsEx">
                            <span class="star" data-value="1">☆</span><span class="star" data-value="2">☆</span>
                            <span class="star" data-value="3">☆</span><span class="star" data-value="4">☆</span>
                            <span class="star" data-value="5">☆</span>
                        </div>
                        <textarea id="feedbackCommentEx" rows="2" placeholder="Vos remarques (facultatif)"></textarea>
                        <button id="submitFeedbackEx">Envoyer mon avis</button>
                    </div>
                </div>
            </div>
            <!-- ... autres panels ... -->
        </div>
    </div>
    <!-- ... audioPlayerBar, historyModal ... -->

    <script>
        // (tout le script existant, avec modifications pour utiliser les nouvelles flèches)
        (function() {
            // ... toutes les fonctions (loading, audio, état, swipe, etc.) identiques ...

            // On récupère les nouvelles flèches
            const prevDayArrow = document.getElementById('prevDayArrow');
            const nextDayArrow = document.getElementById('nextDayArrow');
            const jourHeader = document.getElementById('jourHeader');
            const jourTitleSpan = document.getElementById('jourTitle');

            // On supprime les références aux anciens boutons dans le code (ils n'existent plus)
            // Les fonctions prevDay / nextDay existent déjà (elles utilisent currentPage et afficherPage).
            // On attache les événements aux nouvelles flèches.

            if (prevDayArrow) {
                prevDayArrow.addEventListener('click', () => {
                    if (currentPage > 0) { currentPage--; afficherPage(currentPage); }
                });
            }
            if (nextDayArrow) {
                nextDayArrow.addEventListener('click', () => {
                    if (currentPage > 0) {
                        const jourIdx = currentPage - 1;
                        if (!currentProgression[jourIdx] && currentJours[currentPage]) {
                            alert("Veuillez d'abord valider votre journée en cliquant sur la case qui clignote avant de passer au jour suivant.");
                            return;
                        }
                    }
                    if (currentPage === 0) { currentPage = 1; afficherPage(1); }
                    else if (currentPage < 7) { currentPage++; afficherPage(currentPage); }
                });
            }

            // On modifie la fonction afficherPage pour :
            // - afficher/masquer le jourHeader (visible seulement quand page != 0)
            // - mettre à jour le texte du titre
            function afficherPage(page) {
                const contentDiv = document.getElementById('jourContent');
                const daySpan = document.getElementById('dayCounter');
                // const prevBtn = ... (plus utilisé)
                // const nextBtn = ...
                const feedbackBox = document.getElementById('feedbackBox');
                const welcomeBtn = document.getElementById('audioWelcomeBtn');
                const dayAudioBtn = document.getElementById('audioDayBtn');
                const leftArrow = document.getElementById('swipeLeftArrow');
                const rightArrow = document.getElementById('swipeRightArrow');
                arreterClignotement();

                if (page === 0) {
                    jourHeader.style.display = 'none';
                    contentDiv.innerHTML = welcomeHTML;
                    daySpan.innerText = 'Intro / 8';
                    feedbackBox.style.display = 'none';
                    welcomeBtn.style.display = 'flex';
                    dayAudioBtn.style.display = 'none';
                    leftArrow.style.display = 'none';
                    rightArrow.style.display = 'none';
                    welcomeBtn.onclick = () => { const introText = document.getElementById('jourContent').innerText; if (introText) playAudioChunks(introText, true); };
                } else {
                    jourHeader.style.display = 'flex';
                    jourTitleSpan.innerText = `📆 JOUR ${page}`;
                    const jourNum = page;
                    welcomeBtn.style.display = 'none';
                    if (currentJours[jourNum]) {
                        currentDizaines = decouperEnDizaines(currentJours[jourNum]);
                        currentDizaineIndex = 0;
                        afficherDizaine(0);
                        daySpan.innerText = `Jour ${jourNum} / 7`;
                        feedbackBox.style.display = 'block';
                        dayAudioBtn.style.display = 'flex';
                        dayAudioBtn.onclick = () => { const fullText = currentJours[jourNum]; if (fullText) playAudioChunks(fullText, true); };
                        afficherBarreSegments();
                        leftArrow.style.display = (currentDizaineIndex > 0) ? 'flex' : 'none';
                        rightArrow.style.display = (currentDizaineIndex < currentDizaines.length - 1) ? 'flex' : 'none';
                    } else {
                        contentDiv.innerHTML = '<em>Chargement du jour...</em>';
                        chargerJour(jourNum);
                    }
                }
                updateValidationMessage();
            }

            // Le reste du script (chargerJour, démarrage expertise, swipe, etc.) reste strictement identique.
            // Attention : les événements des anciens boutons ne sont plus ajoutés.
            // Il faut également supprimer les addEventListener sur prevDay et nextDay qui n'existent plus.
            // On va commenter ou retirer les lignes qui y font référence dans la partie d'initialisation.

            // Pour éviter toute erreur, on vérifie que les éléments n'existent pas avant d'ajouter des écouteurs.
            // On laisse tout le reste du code inchangé (gestion de l'état, historique, audio, etc.)

            // (On conserve tout le reste du code JavaScript, y compris la gestion des badges, etc.)
        })();
    </script>
</body>
</html>
