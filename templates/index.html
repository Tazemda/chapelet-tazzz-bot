<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 CHAPELET TAZZZ BOT – EXPERTISE 7 JOURS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e2b3c 0%, #0f1a24 100%);
            margin: 0;
            padding: 20px;
            color: #f0f0f0;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; font-size: 2.2rem; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 1rem; opacity: 0.8; margin-bottom: 25px; }
        .mode-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .mode-btn {
            background: #2c3e4e;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        .mode-btn.active { background: #e67e22; box-shadow: 0 0 15px rgba(230,126,34,0.5); }
        .mode-panel { display: none; animation: fadeIn 0.4s ease; }
        .mode-panel.active-panel { display: block; }
        input, textarea {
            width: 100%; padding: 12px; margin: 10px 0;
            border-radius: 12px; border: none; background: #f0f0f0; font-size: 1rem;
        }
        button {
            background: #e67e22; border: none; color: white; padding: 12px 24px;
            border-radius: 40px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        .result {
            background: #0b1620;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 550px;
            overflow-y: auto;
            border-left: 5px solid #e67e22;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }
        .nav-buttons button { width: auto; margin: 0; }
        .day-counter { font-size: 0.9rem; }
        .progress-container {
            margin: 15px 0 10px 0;
            width: 100%;
        }
        .progress-bar {
            width: 100%;
            background-color: #2c3e4e;
            border-radius: 10px;
            overflow: hidden;
            height: 20px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #2ecc71;
            transition: width 0.2s ease;
        }
        .progress-text {
            text-align: center;
            margin-top: 5px;
            font-size: 0.8rem;
            color: #2ecc71;
        }
        .feedback-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
        }
        .stars { display: inline-flex; gap: 5px; margin: 10px; }
        .star { font-size: 28px; cursor: pointer; color: #555; transition: color 0.2s; }
        .star.selected { color: gold; }
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .action-buttons button {
            background: #2c3e4e;
            margin-top: 0;
            padding: 8px 20px;
            font-size: 0.9rem;
        }
        .footer { text-align: center; margin-top: 30px; font-size: 0.8rem; opacity: 0.8; }
        .copyright { font-size: 0.7rem; margin-top: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 CHAPELET TAZZZ BOT 📿</h1>
    <div class="subtitle">Transforme ta structure mentale</div>
    <div class="mode-selector">
        <button class="mode-btn active" data-mode="expertise">📚 Expertise (7 jours)</button>
        <button class="mode-btn" data-mode="personnel">🔥 Développement personnel (21/66j)</button>
        <button class="mode-btn" data-mode="consultation">💬 Consultation</button>
    </div>

    <!-- Mode Expertise -->
    <div id="expertisePanel" class="mode-panel active-panel">
        <p>🔬 Domaine à maîtriser :</p>
        <input type="text" id="domaine" placeholder="Ex: Prévention du risque thrombo-embolique">
        <button id="startExpertise">✨ DÉMARRER L'EXPERTISE ✨</button>
        <div id="jourContainer" style="display:none;">
            <div id="jourContent" class="result"></div>
            <div class="nav-buttons">
                <button id="prevDay" disabled>◀ Précédent</button>
                <span id="dayCounter">Intro / 8</span>
                <button id="nextDay">Suivant ▶</button>
            </div>
            <!-- Barre de progression verte (juste en dessous des boutons) -->
            <div id="expertiseProgressArea" class="progress-container" style="display:none;">
                <div class="progress-bar"><div id="expertiseProgressFill" class="progress-fill"></div></div>
                <div id="expertiseProgressText" class="progress-text">0%</div>
            </div>
            <div id="feedbackBox" class="feedback-box" style="display:none;">
                <p>🌟 Ce chapelet vous a-t-il été utile ?</p>
                <div class="stars" id="starsEx">
                    <span class="star" data-value="1">☆</span>
                    <span class="star" data-value="2">☆</span>
                    <span class="star" data-value="3">☆</span>
                    <span class="star" data-value="4">☆</span>
                    <span class="star" data-value="5">☆</span>
                </div>
                <textarea id="feedbackCommentEx" rows="2" placeholder="Vos remarques (facultatif)"></textarea>
                <button id="submitFeedbackEx">Envoyer mon avis</button>
            </div>
        </div>
    </div>

    <!-- Mode Personnel -->
    <div id="personnelPanel" class="mode-panel">
        <p>📝 5 défauts (un par ligne) :</p>
        <textarea id="defauts" rows="5" placeholder="Je me lève tard&#10;Je suis paresseux&#10;Je dépense sans compter&#10;Je suis timide&#10;Je manque de motivation"></textarea>
        <button id="generatePersonnel">✨ GÉNÉRER MON CHAPELET ✨</button>
        <div id="personnelResult" class="result"></div>
        <div id="personnelLoader" class="progress-container" style="display:none;">
            <div class="progress-bar"><div id="personnelProgressFill" class="progress-fill"></div></div>
            <div id="personnelProgressText" class="progress-text">0%</div>
        </div>
    </div>

    <!-- Mode Consultation -->
    <div id="consultationPanel" class="mode-panel">
        <p>💬 Décrivez votre besoin :</p>
        <textarea id="consultMessage" rows="4" placeholder="Ex: Je veux maîtriser la prévention du risque thrombo-embolique..."></textarea>
        <button id="generateConsult">✨ GÉNÉRER ✨</button>
        <div id="consultResult" class="result"></div>
        <div id="consultLoader" class="progress-container" style="display:none;">
            <div class="progress-bar"><div id="consultProgressFill" class="progress-fill"></div></div>
            <div id="consultProgressText" class="progress-text">0%</div>
        </div>
    </div>

    <!-- Boutons d'action (partage et abonnement) -->
    <div class="action-buttons">
        <button id="shareButton">📤 Partager</button>
        <button id="subscribeButton">🔒 S'abonner</button>
    </div>

    <div class="footer">
        <div class="copyright">Plasticité cérébrale & répétition rythmée.<br>© Dr Tazzz</div>
    </div>
</div>

<script>
    // Onglets
    const modeBtns = document.querySelectorAll('.mode-btn');
    const panels = {
        expertise: document.getElementById('expertisePanel'),
        personnel: document.getElementById('personnelPanel'),
        consultation: document.getElementById('consultationPanel')
    };
    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const mode = btn.getAttribute('data-mode');
            Object.values(panels).forEach(p => p.classList.remove('active-panel'));
            panels[mode].classList.add('active-panel');
        });
    });

    // ========== PAGE PRÉLIMINAIRE (fixe) ==========
    const PAGE0 = `
# 📖 Bienvenue dans votre chapelet d’expertise

## 🧠 COMMENT UTILISER LE CHAPELET TAZZZ BOT ?
- **Procurez‑vous un vrai chapelet** que vous égrènerez durant vos lectures et récitations.
- Chaque jour, lisez ou récitez à voix haute le contenu du jour.
- Respectez les **instructions** : 
  - *Tenez le gros grain correspondant* pour la **Méditation du Mystère**. Chaque Mystère correspond tout simplement à une grande fiche synthétique sur l'un des 5 sujets du jour. Vous devrez lire simplement chaque mystère et si nécessaire vous pouvez consulter vos notes ou d'autres sources.
  - *Répétez 3 fois* le contenu qui est à la place du **Notre Père**. 
  - *Répétez 10 fois* (5 lectures, 5 sans regarder) le contenu à la place du **Je vous salue Marie**.
- Les **5 dizaines** d’un jour correspondent à 5 concepts clés.

👉 Cliquez sur **“Suivant”** pour commencer le **Jour 1**.
    `;

    // ========== EXPERTISE ==========
    let domaine = '';
    let jours = {};
    let currentPage = 0;
    const totalPages = 8;
    let currentExpertiseInterval = null;

    function startExpertiseProgress() {
        const area = document.getElementById('expertiseProgressArea');
        const fill = document.getElementById('expertiseProgressFill');
        const text = document.getElementById('expertiseProgressText');
        if (!area || !fill || !text) return null;
        area.style.display = 'block';
        let percent = 0;
        const interval = setInterval(() => {
            if (percent < 90) {
                percent += 2;
                if (percent > 90) percent = 90;
                fill.style.width = percent + '%';
                text.innerText = percent + '%';
            }
        }, 150);
        return interval;
    }

    function stopExpertiseProgress(interval, complete = true) {
        const area = document.getElementById('expertiseProgressArea');
        const fill = document.getElementById('expertiseProgressFill');
        const text = document.getElementById('expertiseProgressText');
        if (interval) clearInterval(interval);
        if (complete && fill && text) {
            fill.style.width = '100%';
            text.innerText = '100%';
            setTimeout(() => {
                if (area) area.style.display = 'none';
                if (fill) fill.style.width = '0%';
                if (text) text.innerText = '0%';
            }, 300);
        } else {
            if (area) area.style.display = 'none';
            if (fill) fill.style.width = '0%';
            if (text) text.innerText = '0%';
        }
    }

    function afficherPage(page) {
        const contentDiv = document.getElementById('jourContent');
        const daySpan = document.getElementById('dayCounter');
        const prevBtn = document.getElementById('prevDay');
        const nextBtn = document.getElementById('nextDay');
        const feedbackBox = document.getElementById('feedbackBox');
        
        if (page === 0) {
            contentDiv.innerHTML = PAGE0.replace(/\n/g, '<br>');
            daySpan.innerText = 'Intro / 8';
            prevBtn.disabled = true;
            nextBtn.disabled = false;
            feedbackBox.style.display = 'none';
        } else {
            const jourNum = page;
            if (jours[jourNum]) {
                contentDiv.innerHTML = jours[jourNum].replace(/\n/g, '<br>');
                daySpan.innerText = `Jour ${jourNum} / 7`;
                prevBtn.disabled = (jourNum === 1);
                nextBtn.disabled = (jourNum === 7);
                feedbackBox.style.display = 'block';
            } else {
                contentDiv.innerHTML = '<em>Chargement du jour...</em>';
                chargerJour(jourNum);
            }
        }
    }

    function chargerJour(jourNum) {
        if (currentExpertiseInterval) clearInterval(currentExpertiseInterval);
        currentExpertiseInterval = startExpertiseProgress();
        fetch('/generer_jour_expertise', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ domaine: domaine, jour: jourNum })
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) throw new Error(data.error);
            jours[jourNum] = data.contenu;
            stopExpertiseProgress(currentExpertiseInterval, true);
            afficherPage(jourNum);
        })
        .catch(err => {
            console.error(err);
            jours[jourNum] = `<strong>Erreur de génération</strong><br>Contenu non disponible pour le jour ${jourNum}. Rafraîchissez ou réessayez.`;
            stopExpertiseProgress(currentExpertiseInterval, false);
            afficherPage(jourNum);
        });
    }

    document.getElementById('startExpertise').addEventListener('click', () => {
        domaine = document.getElementById('domaine').value.trim();
        if (!domaine) { alert('Domaine requis'); return; }
        jours = {};
        currentPage = 0;
        afficherPage(0);
        document.getElementById('jourContainer').style.display = 'block';
        document.getElementById('startExpertise').style.display = 'none';
    });

    document.getElementById('prevDay').addEventListener('click', () => {
        if (currentPage > 0) {
            currentPage--;
            afficherPage(currentPage);
        }
    });
    document.getElementById('nextDay').addEventListener('click', () => {
        if (currentPage < totalPages - 1) {
            currentPage++;
            afficherPage(currentPage);
        }
    });

    // Feedback Expertise
    let currentNoteEx = 0;
    const starsEx = document.querySelectorAll('#starsEx .star');
    starsEx.forEach(star => {
        star.addEventListener('click', () => {
            currentNoteEx = parseInt(star.getAttribute('data-value'));
            starsEx.forEach(s => {
                const val = parseInt(s.getAttribute('data-value'));
                if (val <= currentNoteEx) {
                    s.textContent = '★';
                    s.classList.add('selected');
                } else {
                    s.textContent = '☆';
                    s.classList.remove('selected');
                }
            });
        });
    });
    document.getElementById('submitFeedbackEx').addEventListener('click', async () => {
        if (currentNoteEx === 0) { alert('Sélectionnez une note'); return; }
        const comment = document.getElementById('feedbackCommentEx').value.trim();
        try {
            const res = await fetch('/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ note: currentNoteEx, commentaire: comment })
            });
            const data = await res.json();
            if (data.status === 'ok') {
                alert('Merci pour votre avis !');
                document.getElementById('feedbackBox').style.display = 'none';
            } else alert('Erreur');
        } catch (err) { alert('Erreur réseau'); }
    });

    // ========== MODE PERSONNEL ==========
    let currentPersonnelInterval = null;
    function startGenericProgress(areaId, fillId, textId) {
        const area = document.getElementById(areaId);
        const fill = document.getElementById(fillId);
        const textSpan = document.getElementById(textId);
        if (!area || !fill || !textSpan) return null;
        area.style.display = 'block';
        let percent = 0;
        const interval = setInterval(() => {
            if (percent < 90) {
                percent += 2;
                if (percent > 90) percent = 90;
                fill.style.width = percent + '%';
                textSpan.innerText = percent + '%';
            }
        }, 150);
        return interval;
    }
    function stopGenericProgress(areaId, fillId, textId, interval, complete = true) {
        const area = document.getElementById(areaId);
        const fill = document.getElementById(fillId);
        const textSpan = document.getElementById(textId);
        if (interval) clearInterval(interval);
        if (complete && fill && textSpan) {
            fill.style.width = '100%';
            textSpan.innerText = '100%';
            setTimeout(() => {
                if (area) area.style.display = 'none';
                if (fill) fill.style.width = '0%';
                if (textSpan) textSpan.innerText = '0%';
            }, 300);
        } else {
            if (area) area.style.display = 'none';
            if (fill) fill.style.width = '0%';
            if (textSpan) textSpan.innerText = '0%';
        }
    }

    document.getElementById('generatePersonnel').addEventListener('click', async () => {
        let defauts = document.getElementById('defauts').value.split('\n').filter(l => l.trim()).slice(0,5);
        if (defauts.length !== 5) { alert('5 défauts requis'); return; }
        document.getElementById('personnelResult').innerHTML = '';
        if (currentPersonnelInterval) clearInterval(currentPersonnelInterval);
        currentPersonnelInterval = startGenericProgress('personnelLoader', 'personnelProgressFill', 'personnelProgressText');
        try {
            const res = await fetch('/generer_personnel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ defauts: defauts })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            stopGenericProgress('personnelLoader', 'personnelProgressFill', 'personnelProgressText', currentPersonnelInterval, true);
            document.getElementById('personnelResult').innerHTML = data.contenu.replace(/\n/g, '<br>');
        } catch (err) {
            stopGenericProgress('personnelLoader', 'personnelProgressFill', 'personnelProgressText', currentPersonnelInterval, false);
            alert('Erreur: ' + err.message);
        }
    });

    // ========== MODE CONSULTATION ==========
    let currentConsultInterval = null;
    document.getElementById('generateConsult').addEventListener('click', async () => {
        let msg = document.getElementById('consultMessage').value.trim();
        if (!msg) { alert('Message requis'); return; }
        document.getElementById('consultResult').innerHTML = '';
        if (currentConsultInterval) clearInterval(currentConsultInterval);
        currentConsultInterval = startGenericProgress('consultLoader', 'consultProgressFill', 'consultProgressText');
        try {
            // Note: il faudrait une route /generer_consultation dans app.py, on redirige vers expertise
            alert('Mode consultation redirige vers Expertise (car route non implémentée)');
            stopGenericProgress('consultLoader', 'consultProgressFill', 'consultProgressText', currentConsultInterval, false);
            domaine = msg;
            jours = {};
            currentPage = 0;
            afficherPage(0);
            document.getElementById('jourContainer').style.display = 'block';
            document.getElementById('startExpertise').style.display = 'none';
            document.querySelector('.mode-btn[data-mode="expertise"]').click();
        } catch (err) {
            stopGenericProgress('consultLoader', 'consultProgressFill', 'consultProgressText', currentConsultInterval, false);
            alert('Erreur: ' + err.message);
        }
    });

    // Boutons partage et abonnement (inchangés)
    document.getElementById('shareButton').addEventListener('click', async () => {
        const url = window.location.href;
        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Chapelet Tazzz Bot',
                    text: 'Découvrez l’outil qui transforme votre structure mentale !',
                    url: url
                });
            } catch (err) {
                if (err.name !== 'AbortError') alert('Partage annulé ou erreur.');
            }
        } else {
            try {
                await navigator.clipboard.writeText(url);
                alert('Lien copié dans le presse-papiers !');
            } catch (err) {
                alert('Impossible de copier le lien manuellement.');
            }
        }
    });
    document.getElementById('subscribeButton').addEventListener('click', () => {
        alert("🔒 L'abonnement n'est pas encore actif. Cette option sera bientôt disponible.\nPour l'instant, l'accès est gratuit.");
    });
</script>
</body>
</html>
