<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 CHAPELET TAZZZ BOT</title>
    <style>
        body { background: #1e2b3c; font-family: 'Segoe UI'; margin: 0; padding: 20px; color: #f0f0f0; }
        .container { max-width: 800px; margin: auto; background: rgba(255,255,255,0.1); border-radius: 24px; padding: 25px; }
        h1 { text-align: center; }
        .mode-selector { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .mode-btn { background: #2c3e4e; border: none; color: white; padding: 12px 24px; border-radius: 40px; cursor: pointer; }
        .mode-btn.active { background: #e67e22; }
        .mode-panel { display: none; }
        .mode-panel.active-panel { display: block; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: none; background: #f0f0f0; }
        button.generate { background: #e67e22; color: white; padding: 14px; font-size: 1rem; border: none; border-radius: 40px; cursor: pointer; width: 100%; margin-top: 20px; }
        .loader { display: none; text-align: center; margin: 20px; }
        .result { background: #0b1620; border-radius: 20px; padding: 20px; margin-top: 30px; white-space: pre-wrap; font-family: monospace; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; }
        .nav-buttons button { background: #2c3e4e; color: white; padding: 8px 16px; border-radius: 20px; cursor: pointer; border: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 CHAPELET TAZZZ BOT 📿</h1>
    <div class="mode-selector">
        <button class="mode-btn active" data-mode="expertise">📚 Expertise (7j)</button>
        <button class="mode-btn" data-mode="personnel">🔥 Développement personnel (21/66j)</button>
        <button class="mode-btn" data-mode="consultation">💬 Consultation</button>
    </div>

    <!-- Expertise -->
    <div id="expertise" class="mode-panel active-panel">
        <p>🔬 Domaine :</p>
        <input type="text" id="domaine" placeholder="Ex: Recherche clinique">
        <button id="initExpertise">✨ DÉMARRER ✨</button>
        <div id="loader" class="loader">⏳ Génération...</div>
        <div id="jourContainer" style="display:none;">
            <div id="jourContent" class="result"></div>
            <div class="nav-buttons">
                <button id="prevDay" disabled>◀ Préc</button>
                <span id="dayCounter">Jour 1/7</span>
                <button id="nextDay">Suiv ▶</button>
            </div>
        </div>
    </div>

    <!-- Personnel -->
    <div id="personnel" class="mode-panel">
        <p>📝 5 défauts (un par ligne) :</p>
        <textarea id="defauts" rows="5"></textarea>
        <button id="generatePersonnel">✨ GÉNÉRER ✨</button>
        <div id="personnelResult" class="result"></div>
    </div>

    <!-- Consultation -->
    <div id="consultation" class="mode-panel">
        <p>💬 Décris ton besoin :</p>
        <textarea id="consultMessage" rows="4"></textarea>
        <button id="generateConsult">✨ ANALYSER ✨</button>
        <div id="consultResult" class="result"></div>
    </div>
</div>

<script>
    // Modes
    const btns = document.querySelectorAll('.mode-btn');
    const panels = { expertise: document.getElementById('expertise'), personnel: document.getElementById('personnel'), consultation: document.getElementById('consultation') };
    let currentMode = 'expertise';
    btns.forEach(btn => {
        btn.addEventListener('click', () => {
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.getAttribute('data-mode');
            Object.values(panels).forEach(p => p.classList.remove('active-panel'));
            panels[currentMode].classList.add('active-panel');
        });
    });

    // Expertise (lazy loading)
    let domaine = '';
    let jours = {};
    let currentJour = 1;

    function afficherJour(jour) {
        document.getElementById('jourContent').innerHTML = jours[jour].replace(/\n/g, '<br>');
        document.getElementById('dayCounter').innerText = `Jour ${jour}/7`;
        document.getElementById('prevDay').disabled = (jour === 1);
        document.getElementById('nextDay').disabled = (jour === 7);
    }

    async function chargerJour(jour) {
        if (jours[jour]) { afficherJour(jour); return; }
        const loader = document.getElementById('loader');
        loader.style.display = 'block';
        try {
            const res = await fetch('/generate_jour', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ domaine: domaine, jour: jour })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            jours[jour] = data.contenu;
            afficherJour(jour);
        } catch (err) {
            alert('Erreur: ' + err.message);
        } finally {
            loader.style.display = 'none';
        }
    }

    document.getElementById('initExpertise').onclick = () => {
        domaine = document.getElementById('domaine').value.trim();
        if (!domaine) return alert('Domaine requis');
        jours = {};
        currentJour = 1;
        chargerJour(1);
        document.getElementById('jourContainer').style.display = 'block';
        document.getElementById('initExpertise').style.display = 'none';
    };
    document.getElementById('prevDay').onclick = () => { if (currentJour > 1) { currentJour--; chargerJour(currentJour); } };
    document.getElementById('nextDay').onclick = () => { if (currentJour < 7) { currentJour++; chargerJour(currentJour); } };

    // Personnel
    document.getElementById('generatePersonnel').onclick = async () => {
        let defauts = document.getElementById('defauts').value.split('\n').filter(l => l.trim()).slice(0,5);
        if (defauts.length !== 5) return alert('5 défauts requis');
        const res = await fetch('/generate_personnel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ defauts })
        });
        const data = await res.json();
        if (data.error) alert(data.error);
        else document.getElementById('personnelResult').innerHTML = data.chapelet.replace(/\n/g, '<br>');
    };

    // Consultation
    document.getElementById('generateConsult').onclick = async () => {
        let msg = document.getElementById('consultMessage').value.trim();
        if (!msg) return alert('Message requis');
        const res = await fetch('/consultation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        if (data.error) alert(data.error);
        else if (data.redirige === 'expertise') {
            document.querySelector('.mode-btn[data-mode="expertise"]').click();
            document.getElementById('domaine').value = data.message;
            document.getElementById('initExpertise').click();
        } else {
            document.querySelector('.mode-btn[data-mode="personnel"]').click();
            alert('Veuillez saisir 5 défauts dans le mode personnel.');
        }
    };
</script>
</body>
</html>
