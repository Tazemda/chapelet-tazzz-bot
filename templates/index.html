<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🧠 CHAPELET TAZZZ BOT – EXPERTISE 7 JOURS</title>
    <style>
        /* ... tous les styles précédents (conservés) ... */
        /* Ajout des styles pour les nouveaux titres */
        .jour-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 4px;
            margin: 10px 0 5px;
            color: #f1c40f;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .dizaine-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 15px;
            border-bottom: 1px solid #e67e22;
            display: inline-block;
            padding-right: 15px;
        }
        .result {
            /* inchangé */
        }
    </style>
    <!-- (le reste du head inchangé) -->
</head>
<body>
    <!-- ... loading screen, container, etc. ... -->

    <!-- Dans la div #jourContainer, juste avant #jourContentContainer -->
    <div id="jourTitle" class="jour-title" style="display: none;"></div>

    <div id="jourContentContainer" style="position: relative;">
        <div id="jourContent" class="result"></div>
        <!-- flèches de swipe ... -->
    </div>

    <script>
        // ... tout le JavaScript existant (avec les modifs ci-dessous) ...
        // Dans la fonction afficherDizaine, ajout du titre de la dizaine
        function afficherDizaine(index, afficherMessageDepassement = false) {
            const contentDiv = document.getElementById('jourContent');
            const leftArrow = document.getElementById('swipeLeftArrow');
            const rightArrow = document.getElementById('swipeRightArrow');
            if (!currentDizaines.length) {
                contentDiv.innerHTML = '<em>Contenu non disponible.</em>';
                leftArrow.style.display = 'none';
                rightArrow.style.display = 'none';
                return;
            }
            if (index < 0) index = 0;
            if (index >= currentDizaines.length) {
                if (afficherMessageDepassement) {
                    const msgDiv = document.getElementById('progressHeaderMsg');
                    if (msgDiv && currentPage > 0 && !currentProgression[currentPage-1]) {
                        msgDiv.style.display = 'block';
                        msgDiv.style.animation = 'blinkText 1s infinite';
                        demarrerClignotement();
                        alert("📿 Vous avez terminé les 5 dizaines ! N'oubliez pas de valider cette journée en cliquant sur la case qui clignote (ou sur le message).");
                    }
                }
                return;
            }
            currentDizaineIndex = index;
            // Ajout du titre de la dizaine au contenu
            let numeroDizaine = currentDizaineIndex + 1;
            let titreDizaine = `<div class="dizaine-title">📖 DIZAINE ${numeroDizaine} / 5</div>`;
            let contenuBrut = currentDizaines[currentDizaineIndex];
            contentDiv.innerHTML = titreDizaine + contenuBrut.replace(/\n/g, '<br>');
            leftArrow.style.display = (currentDizaineIndex > 0) ? 'flex' : 'none';
            rightArrow.style.display = (currentDizaineIndex < currentDizaines.length - 1) ? 'flex' : 'none';
            contentDiv.scrollTop = 0;
        }

        // Dans afficherPage, gérer l'affichage du titre "JOUR X"
        function afficherPage(page) {
            // ... récupérer les éléments ...
            const jourTitleDiv = document.getElementById('jourTitle');
            if (page === 0) {
                jourTitleDiv.style.display = 'none';
                // ... le reste de l'intro ...
            } else {
                jourTitleDiv.style.display = 'block';
                jourTitleDiv.innerText = `📆 JOUR ${page}`;
                // ... le reste (contenu, flèches, etc.) ...
            }
            // ... suite du code inchangé ...
        }
    </script>
</body>
</html>
