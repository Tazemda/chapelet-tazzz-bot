<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Chapelet Tazzz Bot</title>
    <style>
        /* ... (style conservé, identique à la version précédente) ... */
        /* Ajout de quelques styles pour les nouveaux boutons */
        .refresh-all-btn { background: #8e44ad; margin-left: 10px; padding: 6px 15px; font-size: 0.8rem; }
        .share-btn { background: #2c3e4e; padding: 6px 15px; font-size: 0.8rem; }
        .share-btn:hover { background: #e67e22; }
        .share-link-area { margin-top: 10px; padding: 10px; background: #0b1620; border-radius: 10px; display: none; word-break: break-all; }
        .share-link-area input { width: 100%; padding: 8px; border-radius: 8px; border: none; background: #1e2b3c; color: white; }
        .copy-link-btn { background: #2c3e4e; padding: 4px 12px; font-size: 0.7rem; margin-left: 5px; }
    </style>
</head>
<body>
    <!-- ... (header, container, etc. inchangé) ... -->
    <div id="mainContent" style="display: none;">
        <div class="container">
            <!-- ... (top-bar, mode-selector, etc. inchangés) ... -->

            <!-- Panneau Expertise (avec boutons Refresh All et Share) -->
            <div id="expertisePanel" class="mode-panel active-panel">
                <p>🔬 Domaine à maîtriser :</p>
                <input type="text" id="domaine" placeholder="Ex: Recherche clinique, Python, Prise de parole...">
                <button id="startExpertise">✨ DÉMARRER L'EXPERTISE ✨</button>
                <div id="jourContainer" style="display:none;">
                    <div id="progressHeaderMsg" class="progress-header">👉 cliquez ici pour valider cette journée !</div>
                    <div id="segmentsContainer" class="progress-segments"></div>
                    <div id="jourHeader" class="jour-header" style="display: none;">
                        <div id="prevDayTriangle" class="nav-triangle">◀</div>
                        <div id="jourTitle" class="jour-title"></div>
                        <div id="nextDayTriangle" class="nav-triangle">▶</div>
                        <button id="refreshAllBtn" class="refresh-all-btn" style="display:none;">⟳ Tout régénérer</button>
                        <button id="shareFormationBtn" class="share-btn" style="display:none;">🔗 Partager</button>
                    </div>
                    <div id="jourContentContainer" style="position: relative;">
                        <div id="jourContent" class="result"></div>
                        <div id="swipeLeftArrow" class="swipe-arrow swipe-left" style="display: none;">◀</div>
                        <div id="swipeRightArrow" class="swipe-arrow swipe-right" style="display: none;">▶</div>
                        <button id="audioWelcomeBtn" class="audio-welcome" style="display:none;">🔊</button>
                        <button id="audioDayBtn" class="audio-day" style="display:none;">🔊</button>
                        <div id="refreshDizaineBtn" class="refresh-dizaine" style="display: none;">⟳</div>
                    </div>
                    <div class="nav-buttons">
                        <button id="prevDay" disabled>◀ Précédent</button>
                        <span id="dayCounter">Intro / 8</span>
                        <button id="nextDay">Suivant ▶</button>
                    </div>
                    <div id="expertiseProgressArea" class="progress-container" style="display:none;">
                        <div class="progress-fill" id="expertiseProgressFill"></div>
                        <div class="progress-percent" id="expertiseProgressPercent"></div>
                    </div>
                    <div id="feedbackBox" class="feedback-box" style="display:none;">
                        <p>🌟 Ce chapelet vous a-t-il été utile ?</p>
                        <div class="starsEx" id="starsEx">
                            <span class="star" data-value="1">☆</span><span class="star" data-value="2">☆</span>
                            <span class="star" data-value="3">☆</span><span class="star" data-value="4">☆</span>
                            <span class="star" data-value="5">☆</span>
                        </div>
                        <textarea id="feedbackCommentEx" rows="2" placeholder="Vos remarques (facultatif)"></textarea>
                        <button id="submitFeedbackEx">Envoyer mon avis</button>
                    </div>
                    <!-- Zone de partage -->
                    <div id="shareLinkArea" class="share-link-area">
                        <div style="display:flex; gap:5px;">
                            <input type="text" id="shareLinkInput" readonly>
                            <button id="copyShareLinkBtn" class="copy-link-btn">Copier</button>
                        </div>
                        <div style="font-size:0.7rem; margin-top:5px; opacity:0.7;">Partagez ce lien : celui qui l'ouvre importera cette formation comme s'il l'avait générée.</div>
                    </div>
                </div>
            </div>

            <!-- Panneau Cours et Entretien (inchangés) -->
            <!-- ... -->

        </div>
    </div>

    <!-- Audio, historique, etc. inchangés -->

    <script>
        (function() {
            // ---------- TOUT LE CODE EXISTANT (inchangé) ----------
            // ... (loading, audio, gestion expertise, cours, entretien, historique) ...

            // ---------- NOUVEAU : REFRESH ALL ----------
            document.getElementById('refreshAllBtn').addEventListener('click', async function() {
                if (!currentDomaine || !currentJours || currentPage === 0) {
                    alert('Aucune formation chargée.');
                    return;
                }
                if (!confirm('Voulez-vous vraiment régénérer TOUS les jours de cette formation ? Cela écrasera le contenu actuel.')) return;
                const totalJours = currentNbJours;
                let success = 0;
                for (let jour = 1; jour <= totalJours; jour++) {
                    try {
                        const response = await fetch('/generer_jour_expertise', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ domaine: currentDomaine, jour: jour })
                        });
                        const data = await response.json();
                        if (data.error) throw new Error(data.error);
                        currentJours[jour] = data.contenu;
                        success++;
                    } catch (err) {
                        console.error(`Erreur jour ${jour}:`, err);
                    }
                }
                if (success === totalJours) {
                    sauvegarderFormationCourante();
                    afficherPage(); // recharge l'affichage courant
                    alert(`✅ Tous les jours (${success}/${totalJours}) ont été régénérés.`);
                } else {
                    alert(`⚠️ Seulement ${success}/${totalJours} jours ont été régénérés. Vérifiez votre connexion.`);
                }
            });

            // ---------- NOUVEAU : PARTAGE DE FORMATION ----------
            document.getElementById('shareFormationBtn').addEventListener('click', function() {
                if (!currentDomaine || !currentJours || Object.keys(currentJours).length === 0) {
                    alert('Aucune formation à partager.');
                    return;
                }
                const shareData = {
                    domaine: currentDomaine,
                    type: 'expertise', // on peut détecter le type si besoin
                    nbJours: currentNbJours,
                    progression: currentProgression,
                    jours: currentJours
                };
                // Encodage en base64 (URL-safe)
                const json = JSON.stringify(shareData);
                const encoded = btoa(encodeURIComponent(json));
                const baseUrl = window.location.href.split('?')[0];
                const shareUrl = `${baseUrl}?formation=${encoded}`;

                const shareArea = document.getElementById('shareLinkArea');
                const inputField = document.getElementById('shareLinkInput');
                inputField.value = shareUrl;
                shareArea.style.display = 'block';
                // Copier automatiquement dans le presse-papier (si possible)
                try {
                    inputField.select();
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        // on ne fait rien de spécial
                    }).catch(() => {});
                } catch(e) {}
            });

            document.getElementById('copyShareLinkBtn').addEventListener('click', function() {
                const input = document.getElementById('shareLinkInput');
                input.select();
                navigator.clipboard.writeText(input.value).then(() => {
                    alert('Lien copié !');
                }).catch(() => {
                    alert('Copie manuelle : sélectionnez le lien et copiez-le.');
                });
            });

            // ---------- DÉTECTION D'UN LIEN DE PARTAGE À L'OUVERTURE ----------
            function importerFormationDepuisURL() {
                const params = new URLSearchParams(window.location.search);
                const encoded = params.get('formation');
                if (!encoded) return;
                try {
                    const json = decodeURIComponent(atob(encoded));
                    const data = JSON.parse(json);
                    // Vérifier que les données sont complètes
                    if (!data.domaine || !data.jours || !data.progression) {
                        throw new Error('Données incomplètes');
                    }
                    // Créer un titre unique pour éviter les collisions
                    const titre = data.domaine + ' (partagé)';
                    // Vérifier si déjà présent dans l'historique
                    let historique = JSON.parse(localStorage.getItem('historique')) || [];
                    let entry = historique.find(h => h.domaine === titre);
                    if (!entry) {
                        entry = {
                            domaine: titre,
                            dateDebut: new Date().toISOString(),
                            dateFin: null,
                            progression: data.progression.slice(),
                            shared: true,
                            type: data.type || 'expertise',
                            nbJours: data.nbJours || 7
                        };
                        historique.push(entry);
                        localStorage.setItem('historique', JSON.stringify(historique));
                    }
                    // Sauvegarder les jours
                    let joursParDomaine = JSON.parse(localStorage.getItem('joursParDomaine')) || {};
                    joursParDomaine[titre] = data.jours;
                    localStorage.setItem('joursParDomaine', JSON.stringify(joursParDomaine));
                    // Charger la formation
                    chargerFormation(titre, entry.progression.slice(), data.jours, entry.nbJours);
                    // Nettoyer l'URL (optionnel)
                    window.history.replaceState({}, document.title, window.location.pathname);
                    alert(`📥 Formation "${data.domaine}" importée avec succès !`);
                } catch (e) {
                    console.error('Erreur d\'importation depuis le lien :', e);
                    // On ne fait pas de popup pour ne pas gêner l'utilisateur.
                }
            }

            // Appeler l'importation au chargement
            setTimeout(importerFormationDepuisURL, 500);

            // ---------- ADAPTATION DES VISIBILITÉS (dans afficherPage) ----------
            // Ajouter dans afficherPage() l'affichage des nouveaux boutons
            const originalAfficherPage = afficherPage;
            afficherPage = function() {
                originalAfficherPage();
                const refreshAllBtn = document.getElementById('refreshAllBtn');
                const shareBtn = document.getElementById('shareFormationBtn');
                if (currentPage === 0 || !currentJours || Object.keys(currentJours).length === 0) {
                    if (refreshAllBtn) refreshAllBtn.style.display = 'none';
                    if (shareBtn) shareBtn.style.display = 'none';
                    document.getElementById('shareLinkArea').style.display = 'none';
                } else {
                    if (refreshAllBtn) refreshAllBtn.style.display = 'inline-block';
                    if (shareBtn) shareBtn.style.display = 'inline-block';
                    // Ne pas afficher la zone de partage automatiquement
                }
            };
            // Réaffecter la fonction à l'objet global (si besoin)
            window.afficherPage = afficherPage;

        })();
    </script>
</body>
</html>
