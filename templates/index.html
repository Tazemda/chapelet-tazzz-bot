<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🧠 CHAPELET TAZZZ BOT – EXPERTISE 7 JOURS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e2b3c 0%, #0f1a24 100%);
            margin: 0;
            padding: 20px;
            color: #f0f0f0;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            position: relative;
        }
        h1 { text-align: center; font-size: 2.2rem; margin-bottom: 5px; }
        .subtitle {
            text-align: center;
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 35px;
            margin-top: 5px;
            position: relative;
        }
        .history-link {
            position: absolute;
            left: -10px;
            bottom: -30px;
            background: #2c3e4e;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .history-link:hover { background: #e67e22; }
        .mode-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .mode-btn {
            background: #2c3e4e;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        .mode-btn.active { background: #e67e22; box-shadow: 0 0 15px rgba(230,126,34,0.5); }
        .mode-panel { display: none; animation: fadeIn 0.4s ease; }
        .mode-panel.active-panel { display: block; }
        input, textarea {
            width: 100%; padding: 12px; margin: 10px 0;
            border-radius: 12px; border: none; background: #f0f0f0; font-size: 1rem;
        }
        button {
            background: #e67e22; border: none; color: white; padding: 12px 24px;
            border-radius: 40px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        .jour-content-container {
            position: relative;
            margin-top: 10px;
        }
        .result {
            background: #0b1620;
            border-radius: 20px;
            padding: 20px;
            padding-top: 55px; /* dégage l'espace pour le bouton audio */
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 550px;
            overflow-y: auto;
            border-left: 5px solid #e67e22;
        }
        .play-button {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #e67e22;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: 0.2s;
            z-index: 10;
        }
        .play-button:hover {
            background: #d35400;
            transform: scale(1.05);
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }
        .nav-buttons button { width: auto; margin: 0; }
        .day-counter { font-size: 0.9rem; }
        .progress-header {
            text-align: center;
            font-size: 0.7rem;
            margin-bottom: 5px;
            color: #ccc;
        }
        .progress-segments {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin: 5px 0 15px 0;
            flex-wrap: wrap;
        }
        .segment {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background-color: #2c3e4e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .segment.completed {
            background-color: #aa00ff;
            box-shadow: 0 0 6px #aa00ff;
        }
        .segment.disabled {
            cursor: not-allowed;
            opacity: 0.5;
            pointer-events: none;
        }
        .progress-container {
            margin: 15px 0 10px 0;
            width: 100%;
        }
        .progress-bar {
            width: 100%;
            background-color: #2c3e4e;
            border-radius: 10px;
            overflow: hidden;
            height: 20px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #2ecc71;
            transition: width 0.2s ease;
        }
        .progress-text {
            text-align: center;
            margin-top: 5px;
            font-size: 0.8rem;
            color: #2ecc71;
        }
        .feedback-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
        }
        .stars { display: inline-flex; gap: 5px; margin: 10px; }
        .star { font-size: 28px; cursor: pointer; color: #555; transition: color 0.2s; }
        .star.selected { color: gold; }
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .action-buttons button {
            background: #2c3e4e;
            margin-top: 0;
            padding: 8px 20px;
            font-size: 0.9rem;
        }
        .footer { text-align: center; margin-top: 30px; font-size: 0.8rem; opacity: 0.8; }
        .copyright { font-size: 0.7rem; margin-top: 10px; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e2b3c;
            max-width: 500px;
            width: 90%;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
        }
        .audio-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .audio-controls button {
            background: #2c3e4e;
            margin: 0;
            padding: 8px 16px;
        }
        input[type="range"] {
            width: 80%;
            margin: 10px auto;
        }
        .history-item {
            background: #2c3e4e;
            margin: 10px 0;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
        }
        .badge-text {
            font-size: 0.8rem;
            color: #e67e22;
            margin-top: 4px;
        }
        /* Interlignes très resserrés pour le message d'accueil */
        .intro-text {
            line-height: 1.2;
        }
        .intro-text p, .intro-text li, .intro-text div {
            margin: 0.2rem 0;
        }
        .intro-text ul, .intro-text ol {
            margin: 0.2rem 0;
            padding-left: 1.2rem;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
