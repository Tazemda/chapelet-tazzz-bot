<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 CHAPELET TAZZZ BOT</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e2b3c; margin: 0; padding: 20px; color: #f0f0f0; }
        .container { max-width: 800px; margin: auto; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 24px; padding: 25px; }
        h1 { text-align: center; }
        .mode-selector { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .mode-btn { background: #2c3e4e; border: none; color: white; padding: 12px 24px; border-radius: 40px; cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: #e67e22; }
        .mode-panel { display: none; animation: fadeIn 0.4s; }
        .mode-panel.active-panel { display: block; }
        input, textarea { width: 96%; padding: 12px; margin: 10px 0; border-radius: 12px; border: none; background: #f0f0f0; }
        button { background: #e67e22; border: none; color: white; padding: 10px 20px; border-radius: 40px; cursor: pointer; margin: 5px; }
        button:disabled { opacity: 0.5; }
        .result { background: #0b1620; border-radius: 20px; padding: 20px; margin-top: 20px; white-space: pre-wrap; font-family: monospace; border-left: 5px solid #e67e22; max-height: 500px; overflow-y: auto; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
        .feedback-box { margin-top: 20px; background: rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; text-align: center; }
        .stars { display: inline-flex; gap: 5px; margin: 10px; }
        .star { font-size: 28px; cursor: pointer; color: #555; transition: color 0.2s; }
        .star.selected { color: gold; }
        .loader { display: none; text-align: center; margin: 20px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 CHAPELET TAZZZ BOT 📿</h1>
    <div class="mode-selector">
        <button class="mode-btn active" data-mode="expertise">📚 Expertise (7 jours)</button>
        <button class="mode-btn" data-mode="personnel">🔥 Développement personnel (21/66j)</button>
        <button class="mode-btn" data-mode="consultation">💬 Consultation</button>
    </div>

    <!-- Mode Expertise -->
    <div id="expertisePanel" class="mode-panel active-panel">
        <p>🔬 Domaine à maîtriser :</p>
        <input type="text" id="domaine" placeholder="Ex: Prévention des escarres par un auxiliaire de vie">
        <button id="startExpertise">✨ DÉMARRER L'EXPERTISE ✨</button>
        <div id="jourContainer" style="display:none;">
            <div id="jourContent" class="result"></div>
            <div class="nav-buttons">
                <button id="prevDay" disabled>◀ Précédent</button>
                <span id="dayCounter">Jour 1 / 7</span>
                <button id="nextDay">Suivant ▶</button>
            </div>
            <div id="feedbackBox" class="feedback-box" style="display:none;">
                <p>🌟 Ce chapelet vous a-t-il été utile ?</p>
                <div class="stars" id="stars">
                    <span class="star" data-value="1">☆</span>
                    <span class="star" data-value="2">☆</span>
                    <span class="star" data-value="3">☆</span>
                    <span class="star" data-value="4">☆</span>
                    <span class="star" data-value="5">☆</span>
                </div>
                <textarea id="feedbackComment" rows="2" placeholder="Vos remarques (facultatif)"></textarea>
                <button id="submitFeedback">Envoyer mon avis</button>
            </div>
        </div>
        <div id="expertiseLoader" class="loader">⏳ Génération en cours...</div>
    </div>

    <!-- Mode Personnel -->
    <div id="personnelPanel" class="mode-panel">
        <p>📝 5 défauts (un par ligne) :</p>
        <textarea id="defauts" rows="5" placeholder="Je me lève tard&#10;Je suis paresseux&#10;..."></textarea>
        <button id="generatePersonnel">✨ GÉNÉRER MON CHAPELET ✨</button>
        <div id="personnelResult" class="result"></div>
    </div>

    <!-- Mode Consultation -->
    <div id="consultationPanel" class="mode-panel">
        <p>💬 Décrivez votre besoin :</p>
        <textarea id="consultMessage" rows="4" placeholder="Ex: Je veux maîtriser la prévention des escarres..."></textarea>
        <button id="generateConsult">✨ GÉNÉRER ✨</button>
        <div id="consultResult" class="result"></div>
    </div>
</div>

<script>
    // Onglets
    const modeBtns = document.querySelectorAll('.mode-btn');
    const panels = {
        expertise: document.getElementById('expertisePanel'),
        personnel: document.getElementById('personnelPanel'),
        consultation: document.getElementById('consultationPanel')
    };
    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const mode = btn.getAttribute('data-mode');
            Object.values(panels).forEach(p => p.classList.remove('active-panel'));
            panels[mode].classList.add('active-panel');
        });
    });

    // Expertise : pas de préambule, on charge le jour 1 directement
    let domaine = '';
    let jours = {};
    let currentJour = 1;

    function chargerJour(jour) {
        if (jours[jour]) {
            afficherJour(jour);
            return;
        }
        const loader = document.getElementById('expertiseLoader');
        loader.style.display = 'block';
        fetch('/generer_jour', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ domaine: domaine, jour: jour })
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) throw new Error(data.error);
            jours[jour] = data.contenu;
            afficherJour(jour);
        })
        .catch(err => {
            console.error(err);
            jours[jour] = `--- Jour ${jour} (erreur) ---\nImpossible de générer le contenu pour le moment. Veuillez réessayer plus tard.`;
            afficherJour(jour);
        })
        .finally(() => loader.style.display = 'none');
    }

    function afficherJour(jour) {
        document.getElementById('jourContent').innerHTML = jours[jour].replace(/\n/g, '<br>');
        document.getElementById('dayCounter').innerText = `Jour ${jour} / 7`;
        document.getElementById('prevDay').disabled = (jour === 1);
        document.getElementById('nextDay').disabled = (jour === 7);
        document.getElementById('feedbackBox').style.display = 'block';
    }

    document.getElementById('startExpertise').addEventListener('click', () => {
        domaine = document.getElementById('domaine').value.trim();
        if (!domaine) { alert('Domaine requis'); return; }
        jours = {};
        currentJour = 1;
        chargerJour(1);
        document.getElementById('jourContainer').style.display = 'block';
        document.getElementById('startExpertise').style.display = 'none';
    });

    document.getElementById('prevDay').addEventListener('click', () => {
        if (currentJour > 1) {
            currentJour--;
            if (jours[currentJour]) afficherJour(currentJour);
            else chargerJour(currentJour);
        }
    });

    document.getElementById('nextDay').addEventListener('click', () => {
        if (currentJour < 7) {
            currentJour++;
            if (jours[currentJour]) afficherJour(currentJour);
            else chargerJour(currentJour);
        }
    });

    // Feedback
    let currentNote = 0;
    const stars = document.querySelectorAll('#stars .star');
    stars.forEach(star => {
        star.addEventListener('click', () => {
            currentNote = parseInt(star.getAttribute('data-value'));
            stars.forEach(s => {
                const val = parseInt(s.getAttribute('data-value'));
                if (val <= currentNote) {
                    s.textContent = '★';
                    s.classList.add('selected');
                } else {
                    s.textContent = '☆';
                    s.classList.remove('selected');
                }
            });
        });
    });
    document.getElementById('submitFeedback').addEventListener('click', async () => {
        if (currentNote === 0) { alert('Sélectionnez une note'); return; }
        const comment = document.getElementById('feedbackComment').value.trim();
        try {
            const res = await fetch('/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ note: currentNote, commentaire: comment })
            });
            const data = await res.json();
            if (data.status === 'ok') {
                alert('Merci pour votre avis !');
                document.getElementById('feedbackBox').style.display = 'none';
            } else alert('Erreur d’envoi');
        } catch (err) { alert('Erreur réseau'); }
    });

    // Personnel
    document.getElementById('generatePersonnel').addEventListener('click', async () => {
        let defauts = document.getElementById('defauts').value.split('\n').filter(l => l.trim()).slice(0,5);
        if (defauts.length !== 5) { alert('5 défauts requis'); return; }
        document.getElementById('personnelResult').innerHTML = '⏳ Génération...';
        try {
            const res = await fetch('/generer_personnel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ defauts: defauts })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            document.getElementById('personnelResult').innerHTML = data.contenu.replace(/\n/g, '<br>');
        } catch (err) { alert('Erreur: ' + err.message); }
    });

    // Consultation (redirige vers expertise)
    document.getElementById('generateConsult').addEventListener('click', () => {
        let msg = document.getElementById('consultMessage').value.trim();
        if (!msg) { alert('Message requis'); return; }
        domaine = msg;
        jours = {};
        currentJour = 1;
        chargerJour(1);
        document.getElementById('jourContainer').style.display = 'block';
        document.getElementById('startExpertise').style.display = 'none';
        document.getElementById('consultResult').innerHTML = 'Redirection vers le mode Expertise... (consultez l’onglet Expertise)';
    });
</script>
</body>
</html>
