<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 CHAPELET TAZZZ BOT</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e2f; padding: 20px; border-radius: 20px; }
        button, input, textarea { background: #2c3e4e; color: white; border: none; padding: 10px; border-radius: 10px; margin: 5px; }
        button { background: #e67e22; cursor: pointer; }
        .result { background: #0b1620; padding: 15px; border-radius: 15px; white-space: pre-wrap; font-family: monospace; margin-top: 20px; }
        .mode-btn { background: #2c3e4e; margin: 5px; }
        .active { background: #e67e22; }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 CHAPELET TAZZZ BOT</h1>
    <div>
        <button class="mode-btn" data-mode="expertise">📚 Expertise (7j)</button>
        <button class="mode-btn" data-mode="personnel">🔥 Personnel (21j)</button>
        <button class="mode-btn" data-mode="consultation">💬 Consultation</button>
    </div>
    <div id="expertisePanel">
        <p>Domaine à maîtriser :</p>
        <input type="text" id="domaine" placeholder="Ex: Cheminement du médicament">
    </div>
    <div id="personnelPanel" style="display:none;">
        <p>5 défauts (un par ligne) :</p>
        <textarea id="defauts" rows="5" placeholder="Je me lève tard&#10;Je suis paresseux&#10;..."></textarea>
    </div>
    <div id="consultationPanel" style="display:none;">
        <p>Décrivez votre besoin :</p>
        <textarea id="consultMessage" rows="4" placeholder="Je veux maîtriser..."></textarea>
    </div>
    <button id="generateBtn">✨ GÉNÉRER ✨</button>
    <div id="loader" style="display:none;">⏳ Génération...</div>
    <div id="result" class="result"></div>
</div>
<script>
    const modeBtns = document.querySelectorAll('.mode-btn');
    const panels = {
        expertise: document.getElementById('expertisePanel'),
        personnel: document.getElementById('personnelPanel'),
        consultation: document.getElementById('consultationPanel')
    };
    let currentMode = 'expertise';
    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.getAttribute('data-mode');
            Object.values(panels).forEach(p => p.style.display = 'none');
            panels[currentMode].style.display = 'block';
        });
    });
    document.getElementById('generateBtn').addEventListener('click', async () => {
        let payload = { mode: currentMode };
        if (currentMode === 'expertise') {
            let domaine = document.getElementById('domaine').value.trim();
            if (!domaine) return alert('Domaine requis');
            payload.domaine = domaine;
        } else if (currentMode === 'personnel') {
            let defauts = document.getElementById('defauts').value.split('\n').filter(l => l.trim()).slice(0,5);
            if (defauts.length !== 5) return alert('5 défauts requis');
            payload.defauts = defauts;
        } else {
            let msg = document.getElementById('consultMessage').value.trim();
            if (!msg) return alert('Message requis');
            payload.message = msg;
        }
        document.getElementById('loader').style.display = 'block';
        try {
            let res = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            let data = await res.json();
            if (data.error) alert('Erreur: ' + data.error);
            else document.getElementById('result').innerHTML = data.chapelet.replace(/\n/g, '<br>');
        } catch (err) { alert('Erreur réseau'); }
        finally { document.getElementById('loader').style.display = 'none'; }
    });
</script>
</body>
</html>
