<!DOCTYPE html>
<html>
<head><title>Chapelet Tazzz Bot</title></head>
<body>
    <h1>🧠 CHAPELET TAZZZ BOT</h1>
    <input type="text" id="domaine" size="60" placeholder="Ex: Prévention des escarres...">
    <button id="load">Démarrer expertise (Jour 1)</button>
    <div id="result" style="white-space:pre-wrap; margin-top:20px;"></div>
    <script>
        document.getElementById('load').onclick = async () => {
            let domaine = document.getElementById('domaine').value.trim();
            if (!domaine) return alert('Domaine requis');
            let resultDiv = document.getElementById('result');
            resultDiv.innerText = 'Génération en cours...';
            try {
                let res = await fetch('/generer_jour', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({domaine: domaine, jour: 1})
                });
                let data = await res.json();
                if (data.contenu) resultDiv.innerText = data.contenu;
                else resultDiv.innerText = 'Erreur: ' + data.error;
            } catch(e) { resultDiv.innerText = 'Erreur réseau'; }
        };
    </script>
</body>
</html>
