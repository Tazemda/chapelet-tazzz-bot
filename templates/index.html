<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 CHAPELET TAZ BOT – DÉVELOPPEMENT PERSONNEL</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e2b3c 0%, #0f1a24 100%);
            margin: 0;
            padding: 20px;
            color: #f0f0f0;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; font-size: 2.2rem; }
        .subtitle { text-align: center; font-size: 1rem; opacity: 0.8; margin-bottom: 25px; }
        input, textarea {
            width: 100%; padding: 12px; margin: 10px 0;
            border-radius: 12px; border: none; background: #f0f0f0; font-size: 1rem;
        }
        .defauts-group { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
        button.generate {
            background: #e67e22; border: none; color: white; padding: 14px 28px;
            font-size: 1.2rem; border-radius: 40px; cursor: pointer; width: 100%; margin-top: 20px;
        }
        .loader { display: none; text-align: center; margin: 20px 0; }
        .loader.show { display: block; }
        .result {
            background: #0b1620; border-radius: 20px; padding: 20px; margin-top: 30px;
            white-space: pre-wrap; font-family: monospace; font-size: 0.9rem;
            max-height: 500px; overflow-y: auto; border-left: 5px solid #e67e22;
        }
        .copyright { text-align: center; margin-top: 30px; font-size: 0.7rem; opacity: 0.7; }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 CHAPELET TAZ BOT 📿</h1>
    <div class="subtitle">Développement personnel – 21 ou 66 jours</div>

    <p>📝 Saisissez vos 5 défauts (un par ligne) :</p>
    <div class="defauts-group" id="defauts-list"></div>

    <button class="generate" id="generateBtn">✨ GÉNÉRER MON CHAPELET ✨</button>
    <div class="loader" id="loader">⏳ Génération (20-40s)...</div>
    <div id="result" class="result" style="display:none;"></div>
    <div class="copyright">© Dr Tazemda – Chapelet Taz Bot – Plasticité & répétition rythmée</div>
</div>

<script>
    // Créer 5 champs pour les défauts
    const defautsContainer = document.getElementById('defauts-list');
    for (let i = 1; i <= 5; i++) {
        let inp = document.createElement('input');
        inp.type = 'text';
        inp.placeholder = `Défaut ${i} (ex: Je me lève tard)`;
        inp.classList.add('defaut-input');
        defautsContainer.appendChild(inp);
    }

    const generateBtn = document.getElementById('generateBtn');
    const loader = document.getElementById('loader');
    const resultDiv = document.getElementById('result');

    generateBtn.addEventListener('click', async () => {
        let defauts = Array.from(document.querySelectorAll('.defaut-input')).map(i => i.value.trim()).filter(v => v);
        if (defauts.length !== 5) {
            alert('Veuillez remplir les 5 défauts.');
            return;
        }
        const payload = { mode: 'personnel', defauts: defauts };

        loader.classList.add('show');
        resultDiv.style.display = 'none';
        resultDiv.innerHTML = '';
        try {
            let res = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            let data = await res.json();
            if (data.error) alert('Erreur: ' + data.error);
            else {
                resultDiv.innerHTML = data.chapelet.replace(/\n/g, '<br>');
                resultDiv.style.display = 'block';
            }
        } catch (err) { alert(err.message); }
        finally { loader.classList.remove('show'); }
    });
</script>
</body>
</html>
